name: Pull Request

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main, 'release/*']
  workflow_dispatch:

jobs:
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@main
    with:
      license_header_check_enabled: false
      license_header_check_project_name: "Swift.org"
      api_breakage_check_enabled: false
      docs_check_enabled: false
      format_check_enabled: false
      shell_check_enabled: false
      unacceptable_language_check_enabled: true

  freebsd-aarch64-tests:
    name: Test / FreeBSD aarch64
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'networkextension/swiftly' || github.repository == 'swiftlang/swiftly' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install cloudflared
        run: |
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main' | sudo tee /etc/apt/sources.list.d/cloudflared.list
          sudo apt-get update && sudo apt-get install -y cloudflared
      - name: Set up SSH key and known hosts
        env:
          FREEBSD_SSH_KEY: ${{ secrets.FREEBSD_SSH_KEY }}
          FREEBSD_CF_HOSTNAME: ${{ secrets.FREEBSD_CF_HOSTNAME }}
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$FREEBSD_SSH_KEY" > "$HOME/.ssh/freebsd_ci_key"
          chmod 600 "$HOME/.ssh/freebsd_ci_key"
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFqpy2Vs6oX1K5khxWW7INHC8a6meSaSvNDVXpCSv1Gj\n' \
            "$FREEBSD_CF_HOSTNAME" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          printf 'Host freebsd-ci\n  HostName %s\n  User swift\n  IdentityFile %s/.ssh/freebsd_ci_key\n  ProxyCommand cloudflared access tcp --hostname %%h\n' \
            "$FREEBSD_CF_HOSTNAME" "$HOME" > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
      - name: Sync source to board
        run: |
          ssh -F "$HOME/.ssh/config" freebsd-ci 'mkdir -p /home/swift/ci/swiftly'
          rsync -avz --delete \
            --exclude='.build' --exclude='.git' \
            -e "ssh -F $HOME/.ssh/config" \
            . freebsd-ci:/home/swift/ci/swiftly/
      - name: Build and Test on FreeBSD aarch64
        run: |
          ssh -F "$HOME/.ssh/config" freebsd-ci /bin/sh << 'ENDSSH'
          set -e
          . "$HOME/swift632-env.sh"
          cd "$HOME/ci/swiftly"
          swift package resolve 2>&1
          # CNIOLinux: ALL content in shim.c is inside #ifdef __linux__. The header has two
          # #ifdef __linux__ blocks; the second one (after liburing_nio.h include) wraps ALL
          # the typedef and function declarations through line 180. Fix: inject a FreeBSD
          # section AFTER #include "liburing_nio.h" (between the two linux blocks, outside
          # both), providing static inline implementations of all needed functions.
          # Reset first to prevent double-patch from board retaining modified files across CI runs.
          CNIOLINUX=$(find .build/checkouts -path "*/CNIOLinux/include/CNIOLinux.h" 2>/dev/null | head -1)
          if [ -n "$CNIOLINUX" ]; then
            CNIODIR=$(dirname "$(dirname "$(dirname "$(dirname "$CNIOLINUX")")")")
            git -C "$CNIODIR" checkout HEAD -- Sources/CNIOLinux/include/CNIOLinux.h
            awk '
            /^#include "liburing_nio.h"$/ && !freebsd_done {
              print
              print "#if defined(__FreeBSD__) /* FreeBSD-cniolinux-fix */"
              print "#include <sys/socket.h>"
              print "#include <netinet/in.h>"
              print "#include <pthread.h>"
              print "#include <pthread_np.h>"
              print "typedef struct { struct msghdr msg_hdr; unsigned int msg_len; } CNIOLinux_mmsghdr;"
              print "typedef struct { struct in6_addr ipi6_addr; unsigned int ipi6_ifindex; } CNIOLinux_in6_pktinfo;"
              print "static inline int CNIOLinux_sendmmsg(int s,CNIOLinux_mmsghdr *v,unsigned int n,int f){return sendmmsg(s,(struct mmsghdr*)v,n,f);}"
              print "static inline int CNIOLinux_recvmmsg(int s,CNIOLinux_mmsghdr *v,unsigned int n,int f,struct timespec *t){return recvmmsg(s,(struct mmsghdr*)v,n,f,t);}"
              print "static inline struct cmsghdr *CNIOLinux_CMSG_FIRSTHDR(const struct msghdr *m){return CMSG_FIRSTHDR(m);}"
              print "static inline struct cmsghdr *CNIOLinux_CMSG_NXTHDR(struct msghdr *m,struct cmsghdr *c){return CMSG_NXTHDR(m,c);}"
              print "static inline const void *CNIOLinux_CMSG_DATA(const struct cmsghdr *c){return CMSG_DATA(c);}"
              print "static inline void *CNIOLinux_CMSG_DATA_MUTABLE(struct cmsghdr *c){return CMSG_DATA(c);}"
              print "static inline size_t CNIOLinux_CMSG_LEN(size_t n){return CMSG_LEN(n);}"
              print "static inline size_t CNIOLinux_CMSG_SPACE(size_t n){return CMSG_SPACE(n);}"
              print "static inline int CNIOLinux_pthread_setname_np(pthread_t t,const char *n){pthread_set_name_np(t,n);return 0;}"
              print "static inline int CNIOLinux_pthread_getname_np(pthread_t t,char *n,size_t l){pthread_get_name_np(t,n,l);return 0;}"
              print "static inline int CNIOLinux_accept4(int s,struct sockaddr *a,socklen_t *l,int f){return accept4(s,a,l,f);}"
              print "#endif /* __FreeBSD__ */"
              freebsd_done=1
              next
            }
            1' "$CNIOLINUX" > /tmp/_cniolinux.h
            mv /tmp/_cniolinux.h "$CNIOLINUX"
            echo "Patched $CNIOLINUX"
          fi
          # CNIOBoringSSL: FreeBSD sys/time.h guards gettimeofday behind __XSI_VISIBLE,
          # which is 0 unless _XOPEN_SOURCE>=500. BoringSSL doesn't define it.
          # Inject _XOPEN_SOURCE 600 + sys/time.h unconditionally at line 1.
          # Also strip any prior v1 patch (2-line) before applying the new 5-line one.
          SSL_LIB=$(find .build/checkouts -path "*/CNIOBoringSSL*/ssl/ssl_lib.cc" 2>/dev/null | head -1)
          if [ -n "$SSL_LIB" ]; then
            grep -qF 'FreeBSD-gettimeofday-xsi' "$SSL_LIB" || {
              grep -q 'FreeBSD-gettimeofday' "$SSL_LIB" && sed -i '' '1,2d' "$SSL_LIB"
              awk 'NR==1{print "/* FreeBSD-gettimeofday-xsi */\n#ifndef _XOPEN_SOURCE\n#define _XOPEN_SOURCE 600\n#endif\n#include <sys/time.h>"}1' "$SSL_LIB" > /tmp/_ssl.cc
              mv /tmp/_ssl.cc "$SSL_LIB"
              echo "Patched $SSL_LIB"
            }
          fi
          # async-http-client CAsyncHTTPClient.c: strptime_l is behind __BSD_VISIBLE in
          # FreeBSD time.h; no locale.h included for FreeBSD. Forward-declare both.
          AHC=$(find .build/checkouts -path "*/CAsyncHTTPClient/CAsyncHTTPClient.c" 2>/dev/null | head -1)
          if [ -n "$AHC" ]; then
            grep -qF 'FreeBSD-strptime-fix' "$AHC" || {
              awk 'NR==1{print "/* FreeBSD-strptime-fix */\n#if defined(__FreeBSD__)\n#include <locale.h>\nextern char *strptime_l(const char *, const char *, struct tm *, locale_t);\n#endif"}1' \
                "$AHC" > /tmp/_ahc.c
              mv /tmp/_ahc.c "$AHC"
              echo "Patched $AHC"
            }
          fi
          # CNIOBoringSSL: getentropy in unistd.h is behind __BSD_VISIBLE on FreeBSD.
          # Forward-declare it directly so no feature macros are needed.
          GE=$(find .build/checkouts -path "*/CNIOBoringSSL*/crypto/rand/getentropy.cc" 2>/dev/null | head -1)
          if [ -n "$GE" ]; then
            grep -qF 'FreeBSD-getentropy-fix' "$GE" || {
              awk 'NR==1{print "/* FreeBSD-getentropy-fix */\n#if defined(__FreeBSD__)\nextern \"C\" int getentropy(void*, __SIZE_TYPE__);\n#endif"}1' "$GE" > /tmp/_ge.cc
              mv /tmp/_ge.cc "$GE"
              echo "Patched $GE"
            }
          fi
          # All NIO-style lock files: FreeBSD pthread types are opaque pointers like OpenBSD
          find .build/checkouts \( -name "Locks.swift" -o -name "NIOLock.swift" \) 2>/dev/null | while read LOCKS; do
            grep -qF "pthread" "$LOCKS" || continue
            grep -qF "os(OpenBSD) || os(FreeBSD)" "$LOCKS" || \
              sed -i '' 's/os(OpenBSD)/os(OpenBSD) || os(FreeBSD)/g' "$LOCKS"
            grep -qF "pthread_rwlock_t?>" "$LOCKS" || \
              sed -i '' 's/pthread_rwlock_t> =/pthread_rwlock_t?> =/' "$LOCKS"
            grep -qF "LockPrimitive = pthread_mutex_t?" "$LOCKS" || \
              sed -i '' 's/typealias LockPrimitive = pthread_mutex_t$/typealias LockPrimitive = pthread_mutex_t?/' "$LOCKS"
            grep -qF "pthread_mutexattr_t(bitPattern:" "$LOCKS" || \
              sed -i '' 's/var attr = pthread_mutexattr_t()/var attr: pthread_mutexattr_t? = pthread_mutexattr_t(bitPattern: 0)/' "$LOCKS"
            echo "Patched $LOCKS"
          done
          # swift-log Logging.swift: Glibc.stdout/stderr non-optional on FreeBSD (unlike Linux)
          LOGGING=$(find .build/checkouts -path "*/swift-log*/Logging.swift" 2>/dev/null | head -1)
          if [ -n "$LOGGING" ]; then
            grep -qF "Glibc.stdout!" "$LOGGING" && \
              sed -i '' 's/Glibc\.stdout!/Glibc.stdout/g; s/Glibc\.stderr!/Glibc.stderr/g' "$LOGGING" && \
              echo "Patched $LOGGING"
          fi
          # swift-subprocess Thread.swift: two FreeBSD fixes —
          # 1) MutexType/ConditionType need optional typealiases (opaque pthread types)
          # 2) pthread_t is opaque on FreeBSD: exclude from canImport(Glibc) so FreeBSD
          #    uses pthread_t? (like macOS); _subprocess_pthread_create wants ptr-to-optional
          SUBTHREAD=$(find .build/checkouts -path "*/swift-subprocess*/Thread.swift" 2>/dev/null | head -1)
          if [ -n "$SUBTHREAD" ]; then
            grep -qF "pthread_mutex_t?" "$SUBTHREAD" || {
              awk '/^private typealias MutexType = pthread_mutex_t$/{
                print "#if os(FreeBSD) || os(OpenBSD)\nprivate typealias MutexType = pthread_mutex_t?\nprivate typealias ConditionType = pthread_cond_t?\n#else\n" $0; next}
              /^private typealias ConditionType = pthread_cond_t$/{print $0 "\n#endif"; next}1' \
                "$SUBTHREAD" > /tmp/_th.swift
              mv /tmp/_th.swift "$SUBTHREAD"
              echo "Patched $SUBTHREAD (typealiases)"
            }
            # Remove stray column-0 #endif left by a prior bad undo (awk guard race)
            awk 'prev == "    var thread = pthread_t()" && /^#endif$/{next} {prev=$0; print}' \
              "$SUBTHREAD" > /tmp/_th.swift && mv /tmp/_th.swift "$SUBTHREAD"
            # pthread_t is also opaque on FreeBSD: exclude from canImport(Glibc)
            # so FreeBSD falls into #else branch and uses pthread_t? like macOS
            grep -qF '!os(FreeBSD) && !os(OpenBSD)) || canImport(Bionic)' "$SUBTHREAD" || {
              sed -i '' 's/#if canImport(Glibc) || canImport(Bionic)/#if (canImport(Glibc) \&\& !os(FreeBSD) \&\& !os(OpenBSD)) || canImport(Bionic)/g' "$SUBTHREAD"
              echo "Patched $SUBTHREAD (pthread_t? fix)"
            }
          fi
          # swift-nio lock.swift: has os(OpenBSD) already — add || os(FreeBSD) to all guards
          NIOLOCK=$(find .build/checkouts -path "*/swift-nio/Sources/NIOConcurrencyHelpers/lock.swift" 2>/dev/null | head -1)
          if [ -n "$NIOLOCK" ]; then
            grep -qF "os(OpenBSD) || os(FreeBSD)" "$NIOLOCK" || {
              sed -i '' 's/os(OpenBSD)/os(OpenBSD) || os(FreeBSD)/g' "$NIOLOCK"
              echo "Patched $NIOLOCK"
            }
          fi
          # swift-nio BSDSocketAPI.swift: #else #error — add #elseif os(FreeBSD) with Glibc.
          # FreeBSD arpa/inet.h renames inet_ntop→__inet_ntop via macro when __BSD_VISIBLE=1,
          # so Swift sees __inet_ntop/__inet_pton instead of the POSIX names.
          BSD=$(find .build/checkouts -path "*/swift-nio/Sources/NIOCore/BSDSocketAPI.swift" 2>/dev/null | head -1)
          if [ -n "$BSD" ]; then
            grep -qF 'FreeBSD-bsdsocket-fix' "$BSD" || {
              awk '/^#elseif canImport\(Darwin\)$/ && !done {
                print "#elseif os(FreeBSD)"
                print "/* FreeBSD-bsdsocket-fix */"
                print "@preconcurrency import Glibc"
                print ""
                print "private let sysInet_ntop:"
                print "    @convention(c) (CInt, UnsafeRawPointer?, UnsafeMutablePointer<CChar>?, socklen_t) -> UnsafePointer<CChar>? ="
                print "        __inet_ntop"
                print "private let sysInet_pton: @convention(c) (CInt, UnsafePointer<CChar>?, UnsafeMutableRawPointer?) -> CInt = __inet_pton"
                done=1
              }
              1' "$BSD" > /tmp/_bsd.swift
              mv /tmp/_bsd.swift "$BSD"
              echo "Patched $BSD"
            }
          fi
          # swift-nio SocketOptionProvider.swift: #else #error — add #elseif os(FreeBSD) with Glibc
          SOP=$(find .build/checkouts -path "*/swift-nio/Sources/NIOCore/SocketOptionProvider.swift" 2>/dev/null | head -1)
          if [ -n "$SOP" ]; then
            grep -qF 'FreeBSD-sockopt-fix' "$SOP" || {
              awk '/^#elseif os\(Windows\)$/ && !done {
                print "#elseif os(FreeBSD)"
                print "/* FreeBSD-sockopt-fix */"
                print "@preconcurrency import Glibc"
                done=1
              }
              1' "$SOP" > /tmp/_sop.swift
              mv /tmp/_sop.swift "$SOP"
              echo "Patched $SOP"
            }
          fi
          # swift-nio SelectorGeneric.swift: FreeBSD uses kqueue like Darwin/OpenBSD
          SEL=$(find .build/checkouts -path "*/swift-nio/Sources/NIOPosix/SelectorGeneric.swift" 2>/dev/null | head -1)
          if [ -n "$SEL" ]; then
            grep -qF 'os(FreeBSD)' "$SEL" || {
              sed -i '' 's/canImport(Darwin) || os(OpenBSD)/canImport(Darwin) || os(OpenBSD) || os(FreeBSD)/g' "$SEL"
              echo "Patched $SEL"
            }
          fi
          # swift-nio SelectorKqueue.swift: entire file gated on Darwin||OpenBSD; FreeBSD has kqueue.
          # Also EVFILT_EXCEPT is Darwin/OpenBSD-only; FreeBSD kqueue does not have it.
          # Fix 1: add os(FreeBSD) to file guard.
          # Fix 2: guard EVFILT_EXCEPT loop entry, replace fallthrough with inline readEOF
          #        handling for FreeBSD, and guard the case EVFILT_EXCEPT: block.
          KQSEL=$(find .build/checkouts -path "*/swift-nio/Sources/NIOPosix/SelectorKqueue.swift" 2>/dev/null | head -1)
          if [ -n "$KQSEL" ]; then
            grep -qF 'os(FreeBSD)' "$KQSEL" || {
              sed -i '' 's/#if canImport(Darwin) || os(OpenBSD)$/#if canImport(Darwin) || os(OpenBSD) || os(FreeBSD)/' "$KQSEL"
              echo "Patched $KQSEL (file guard)"
            }
            grep -qF 'FreeBSD-evfilt-fix' "$KQSEL" || {
              awk '
              /[(]KQueueEventFilterSet[.]read, EVFILT_READ[)], [(][.]write, EVFILT_WRITE[)], [(][.]except, EVFILT_EXCEPT[)],/ && !loop_done {
                sub(", [(][.]except, EVFILT_EXCEPT[)],", ",")
                print
                print "            #if !os(FreeBSD) /* FreeBSD-evfilt-fix */"
                print "            (.except, EVFILT_EXCEPT),"
                print "            #endif"
                loop_done=1
                next
              }
              /fallthrough.*EVFILT_READ.*EV_EOF/ && !fall_done {
                print "            #if !os(FreeBSD)"
                print
                print "            #else"
                print "                if Int32(ev.flags) & EV_EOF != 0 && registration.interested.contains(.readEOF) {"
                print "                    selectorEvent.formUnion(.readEOF)"
                print "                }"
                print "            #endif"
                fall_done=1
                next
              }
              /^            case EVFILT_EXCEPT:$/ && !case_done {
                print "            #if !os(FreeBSD)"
                print
                case_done=1
                next
              }
              case_done && /^            case EVFILT_WRITE:$/ {
                print "            #endif"
                case_done=0
              }
              1' "$KQSEL" > /tmp/_kqsel.swift
              mv /tmp/_kqsel.swift "$KQSEL"
              echo "Patched $KQSEL (EVFILT_EXCEPT)"
            }
          fi
          # swift-nio SocketProtocols.swift: F_SETNOSIGPIPE is Darwin-only. FreeBSD uses global
          # SIGPIPE ignore (like Linux/OpenBSD) — add os(FreeBSD) to that branch.
          SOCKP=$(find .build/checkouts -path "*/swift-nio/Sources/NIOPosix/SocketProtocols.swift" 2>/dev/null | head -1)
          if [ -n "$SOCKP" ]; then
            grep -qF 'FreeBSD-sigpipe-fix' "$SOCKP" || {
              sed -i '' 's/#if os(Linux) || os(Android) || os(OpenBSD)$/#if os(Linux) || os(Android) || os(OpenBSD) || os(FreeBSD) \/* FreeBSD-sigpipe-fix *\//' "$SOCKP"
              echo "Patched $SOCKP"
            }
          fi
          # swift-nio Interfaces.swift: dstaddr/broadaddr getters missing FreeBSD
          IFACE=$(find .build/checkouts -path "*/swift-nio/Sources/NIOCore/Interfaces.swift" 2>/dev/null | head -1)
          if [ -n "$IFACE" ]; then
            grep -qF 'os(FreeBSD)' "$IFACE" || {
              sed -i '' 's/canImport(Darwin) || os(OpenBSD)/canImport(Darwin) || os(OpenBSD) || os(FreeBSD)/g' "$IFACE"
              echo "Patched $IFACE"
            }
          fi
          # swift-nio System.swift: multiple guards missing FreeBSD for kqueue + syscalls + fstat.
          # Always reset to pristine HEAD before patching — board retains modified files across
          # CI runs (swift package resolve doesn't reset them), causing double-patch corruption.
          SYSF=$(find .build/checkouts -path "*/swift-nio/Sources/NIOPosix/System.swift" 2>/dev/null | head -1)
          if [ -n "$SYSF" ]; then
            NIODIR=$(dirname "$(dirname "$(dirname "$SYSF")")")
            git -C "$NIODIR" checkout HEAD -- Sources/NIOPosix/System.swift
            sed -i '' 's/#if os(Linux) || os(Android) || canImport(Darwin) || os(OpenBSD)$/#if os(Linux) || os(Android) || os(FreeBSD) || canImport(Darwin) || os(OpenBSD)/' "$SYSF"
            sed -i '' 's/#elseif os(Linux) || os(Android) || os(OpenBSD)$/#elseif os(Linux) || os(Android) || os(FreeBSD) || os(OpenBSD)/' "$SYSF"
            sed -i '' 's/#if canImport(Darwin) || os(OpenBSD)$/#if canImport(Darwin) || os(OpenBSD) || os(FreeBSD)/' "$SYSF"
            awk '/^internal typealias in6_pktinfo = CNIOLinux_in6_pktinfo$/ {
              print "/* FreeBSD-in6pktinfo-fix */"
              print "#if !os(FreeBSD)"
              print; print "#endif"; next}
            /^private let sysRecvMmsg = CNIOLinux_recvmmsg$/ && !fbsd {
              print; print "#elseif os(FreeBSD)"
              print "private let sysKevent = kevent"
              print "private let sysSendMmsg = CNIOLinux_sendmmsg"
              print "private let sysRecvMmsg = CNIOLinux_recvmmsg"
              fbsd=1; next}
            /^internal typealias kevent_timespec = CNIOOpenBSD\.timespec$/ {
              print; print "#elseif os(FreeBSD)"
              print "internal typealias kevent_timespec = Glibc.timespec"
              next}
            /^            CNIOOpenBSD\.kqueue\(\)$/ {
              print; print "            #elseif os(FreeBSD)"
              print "            Glibc.kqueue()"
              next}
            1' "$SYSF" > /tmp/_sys.swift
            mv /tmp/_sys.swift "$SYSF"
            echo "Patched $SYSF"
          fi
          # swift-nio ControlMessage.swift: in_pktinfo is Linux-only (struct from linux/in.h).
          # FreeBSD uses IP_RECVDSTADDR instead; exclude FreeBSD from in_pktinfo usage.
          # Also reset to pristine HEAD first for the same reason as System.swift above.
          CTRL=$(find .build/checkouts -path "*/swift-nio/Sources/NIOPosix/ControlMessage.swift" 2>/dev/null | head -1)
          if [ -n "$CTRL" ]; then
            NIODIR=$(dirname "$(dirname "$(dirname "$CTRL")")")
            git -C "$NIODIR" checkout HEAD -- Sources/NIOPosix/ControlMessage.swift
            sed -i '' 's/#if !os(OpenBSD)$/#if !os(OpenBSD) \&\& !os(FreeBSD) \/* FreeBSD-inpktinfo-fix *\//' "$CTRL"
            echo "Patched $CTRL"
          fi
          # swift-nio NonBlockingFileIO.swift: uses d_fileno (OpenBSD) vs d_ino (others).
          # FreeBSD also uses d_fileno, so add os(FreeBSD) to the OpenBSD condition.
          NBFIO=$(find .build/checkouts -path "*/swift-nio/Sources/NIOPosix/NonBlockingFileIO.swift" 2>/dev/null | head -1)
          if [ -n "$NBFIO" ]; then
            grep -qF 'FreeBSD-dfileno-fix' "$NBFIO" || {
              sed -i '' 's/#if os(OpenBSD)$/#if os(OpenBSD) || os(FreeBSD) \/* FreeBSD-dfileno-fix *\//' "$NBFIO"
              echo "Patched $NBFIO"
            }
          fi
          # swift-service-lifecycle Lock.swift: only #if os(Windows)/#else, no FreeBSD case.
          # Insert #elseif os(OpenBSD||FreeBSD) with pthread_mutex_t? before the #else branch,
          # and fix pthread_mutexattr_t() which has no default init on FreeBSD.
          SVC=$(find .build/checkouts -path "*/swift-service-lifecycle*/ConcurrencyHelpers/Lock.swift" 2>/dev/null | head -1)
          if [ -n "$SVC" ]; then
            grep -qF "LockPrimitive = pthread_mutex_t?" "$SVC" || {
              awk '/^typealias LockPrimitive = SRWLOCK$/{a=1; print; next}
                a&&/^#else$/{print "#elseif os(OpenBSD) || os(FreeBSD)"; a=0; b=1; next}
                b&&/^@usableFromInline$/{b=0; print; c=1; next}
                c&&/^typealias LockPrimitive = pthread_mutex_t$/{print "typealias LockPrimitive = pthread_mutex_t?\n#else\n@usableFromInline\n"$0; c=0; next}
                1' "$SVC" > /tmp/_svc.swift
              mv /tmp/_svc.swift "$SVC"
              sed -i '' 's/var attr = pthread_mutexattr_t()/var attr: pthread_mutexattr_t? = pthread_mutexattr_t(bitPattern: 0)/' "$SVC"
              echo "Patched $SVC"
            }
          fi
          # swift-async-algorithms Locking.swift: Glibc branch uses pthread_mutex_t.
          # Add os(FreeBSD)||os(OpenBSD) branch BEFORE it (2-space indent = typealias block only).
          LOCKING=$(find .build/checkouts -path "*/swift-async-algorithms*/AsyncAlgorithms/Locking.swift" 2>/dev/null | head -1)
          if [ -n "$LOCKING" ]; then
            grep -qF "os(FreeBSD) || os(OpenBSD)" "$LOCKING" || {
              sed -i '' 's/^  #elseif canImport(Glibc) || canImport(Musl) || canImport(Bionic) || canImport(wasi_pthread)$/  #elseif os(FreeBSD) || os(OpenBSD)\n  typealias Primitive = pthread_mutex_t?\n  #elseif canImport(Glibc) || canImport(Musl) || canImport(Bionic) || canImport(wasi_pthread)/' "$LOCKING"
              echo "Patched $LOCKING"
            }
          fi
          swift build 2>&1
          swift test --filter SwiftlyTests 2>&1
          ENDSSH
        timeout-minutes: 60

  macos-tests-selfhosted:
    name: Test (Self Hosted) / macOS Tahoe ARM64
    runs-on: [self-hosted, macos, tahoe, ARM64]
    if: ${{ github.repository == 'swiftlang/swiftly' }}
    strategy:
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare the action
        run: ./scripts/prep-gh-action.sh --install-swiftly
      - name: Build and Test
        run: swift test
        timeout-minutes: 60

  tests-selfhosted:
    name: Test (Self Hosted) / ${{ matrix.container }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container: ["ubuntu:22.04", "ubuntu:24.04", "redhat/ubi9", "debian:12", "fedora:39"]
    container:
      image: ${{ matrix.container }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare the action
        run: ./scripts/prep-gh-action.sh --install-swiftly
      - name: Build and Test
        # UBI 9 - See https://github.com/swiftlang/swift/issues/80908
        # UBI 9 - See https://github.com/swiftlang/swift/issues/80909
        run: bash -c 'if [[ "${{ matrix.container }}" == "redhat/ubi9" ]]; then swift build --build-tests; else swift test; fi'

  # Verify new platforms without a released Swiftly build
  tests-bootstrapped:
    name: Test (Bootstrapped) / ${{ matrix.container }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container: ["swiftlang/swift:nightly-6.3-fedora41"]
    container:
      image: ${{ matrix.container }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare the action
        run: ./scripts/prep-gh-action.sh
      - name: Build and Test
        run: swift test

  releasebuildcheck:
    name: Release Build Check / Linux
    runs-on: ubuntu-latest
    container:
      image: "redhat/ubi9"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare the action
        run: ./scripts/prep-gh-action.sh --install-swiftly
      - name: Build Artifact
        run: swift run build-swiftly-release --test --skip "999.0.0"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: swiftly-release-x86_64
          path: .build/release/swiftly-*.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Upload Tests
        uses: actions/upload-artifact@v4
        with:
          name: test-swiftly-linux-x86_64
          path: .build/debug/test-swiftly-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 1

  releasebuildcheckmacos:
    name: Release Build Check / macOS
    runs-on: [self-hosted, macos, tahoe, ARM64]
    if: ${{ github.repository == 'swiftlang/swiftly' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare the action
        run: ./scripts/prep-gh-action.sh --install-swiftly
      - name: Build Artifact
        run: swift run build-swiftly-release --test --skip "999.0.0"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: swiftly-release-darwin
          path: .build/release/swiftly-*.pkg
          if-no-files-found: error
          retention-days: 1
      - name: Upload Tests
        uses: actions/upload-artifact@v4
        with:
          name: test-swiftly-macos
          path: .build/release/test-swiftly-macos.tar.gz
          if-no-files-found: error
          retention-days: 1

  releasetest:
    name: Test Release / ${{matrix.shell.pkg}}
    needs: releasebuildcheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [
          {"pkg": "bash", "bin": "/bin/bash"},
          {"pkg": "zsh", "bin": "/bin/zsh"},
          {"pkg": "fish", "bin": "/bin/fish"}
        ]
    container:
      image: "ubuntu:24.04"
    steps:
      - name: Prepare System
        run: apt-get update && DEBIAN_FRONTEND=noninteractive TZ=Etc/UTC apt-get -y install ca-certificates gpg tzdata ${{matrix.shell.pkg}} && chsh -s ${{matrix.shell.bin}}
      - name: Download Release
        uses: actions/download-artifact@v4
        with:
          name: swiftly-release-x86_64
      - name: Download Tests
        uses: actions/download-artifact@v4
        with:
          name: test-swiftly-linux-x86_64
      - name: Extract and Run Workflow Tests
        run: cp swiftly-*.tar.gz /root/swiftly.tar.gz && cp test-swiftly-*.tar.gz /root && cd /root && tar zxf test-swiftly-*.tar.gz && ./test-swiftly -y ./swiftly.tar.gz

  release-custom-install-test:
    name: Test Release - Custom Install Location
    needs: releasebuildcheck
    runs-on: ubuntu-latest
    container:
      image: "ubuntu:24.04"
    steps:
      - name: Prepare System
        run: apt-get update && DEBIAN_FRONTEND=noninteractive TZ=Etc/UTC apt-get -y install ca-certificates gpg tzdata
      - name: Download Release
        uses: actions/download-artifact@v4
        with:
          name: swiftly-release-x86_64
      - name: Download Tests
        uses: actions/download-artifact@v4
        with:
          name: test-swiftly-linux-x86_64
      - name: Extract and Run Workflow Tests
        run: cp swiftly-*.tar.gz /root/swiftly.tar.gz && cp test-swiftly-*.tar.gz /root && cd /root && tar zxf test-swiftly-*.tar.gz && ./test-swiftly -y --custom-location ./swiftly.tar.gz

  formatcheck:
    name: Format Check
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare the action
        run: ./scripts/prep-gh-action.sh --install-swiftly
      - name: Check format
        run: swift run swiftformat --lint --dryrun . || (echo "Please run 'swift run swiftformat .' to format the source code."; exit 1)

  docscheck:
    name: Documentation Check
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    steps:
      - name: Install git
        run: apt-get update && apt-get -y install git
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare the action
        run: ./scripts/prep-gh-action.sh --install-swiftly
      - name: Generate Swiftly CLI Reference and Check for Differences
        run: swift package plugin --allow-writing-to-package-directory generate-docs-reference && bash -c 'git config --global --add safe.directory $(pwd)' && git diff --exit-code Documentation/SwiftlyDocs.docc/swiftly-cli-reference.md || (echo "The documentation hasn't been updated with the latest swiftly command-line reference. Please run 'swift package plugin generate-docs-reference' and commit/push the changes."; exit 1)
      - name: Generate Documentation Set
        run: swift package --allow-writing-to-directory .build/docs generate-documentation --target SwiftlyDocs --output-path .build/docs
      - name: Upload Documentation Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: swiftly-docs
          path: .build/docs/**
          if-no-files-found: error
          retention-days: 1
